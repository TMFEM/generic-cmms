services:
  generic-cmms:
    build: .
    container_name: generic-cmms
    restart: unless-stopped
    ports:
      - "8120:8080"
    # Lets the container reach Nameplate running on this machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-America/New_York}
      APP_NAME: ${APP_NAME:-Generic CMMS}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # 1 = demo instance: shows the demo banner and allows seed_demo.py to wipe and rebuild it.
      DEMO: ${DEMO:-1}
      # Shown as the company on work sent to Nameplate.
      COMPANY_NAME: ${COMPANY_NAME:-}
      NAMEPLATE_URL: ${NAMEPLATE_URL:-}
      NAMEPLATE_KEY: ${NAMEPLATE_KEY:-}
      NAMEPLATE_OWNER_ID: ${NAMEPLATE_OWNER_ID:-}
      # Set to 1 only if you serve the app over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - cmms_data:/data

volumes:
  cmms_data:
